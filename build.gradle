plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

def modArchiveName = findProperty('mod_archive_name') ?: mod_id

base {
    archivesName = modArchiveName
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            if (project.findProperty('withCurios')?.toString()?.toBoolean()) {
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            }

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

// Opt-in integration checks run in their own world and are excluded from normal release builds.
if (project.hasProperty('auditRuntime')) {
    sourceSets.main.java.srcDir 'docs/testing/runtime'
    minecraft.runs.client {
        workingDirectory project.file('build/audit-run')
        property 'thermal_vision.audit', 'true'
        property 'forge.logging.console.level', 'info'
    }
    tasks.matching { it.name == 'runClient' }.configureEach {
        doLast {
            def auditLog = file('build/audit-run/logs/latest.log').text
            if (!auditLog.contains('AUDIT COMPLETE') || auditLog.contains('AUDIT FAILED')) {
                throw new GradleException('Thermal audit checks did not pass; see build/audit-run/logs/latest.log')
            }
        }
    }
}

// Separate opt-in audit; preserve the existing user-provided audit logic.
if (project.hasProperty('gogglesAudit')) {
    sourceSets.main.java.srcDir 'docs/integration/goggles/runtime'
    def auditMode = project.findProperty('withCurios')?.toString()?.toBoolean() ? 'curios' : 'vanilla'
    minecraft.runs.client {
        workingDirectory project.file("build/goggles-audit/${auditMode}/client")
        property 'thermal_vision.gogglesAudit', 'true'
        property 'forge.logging.console.level', 'info'
    }
    minecraft.runs.server {
        workingDirectory project.file("build/goggles-audit/${auditMode}/server")
        property 'thermal_vision.gogglesAudit', 'true'
        property 'forge.logging.console.level', 'info'
    }
    tasks.configureEach { runTask ->
        if (runTask.name in ['runClient', 'runServer']) {
            doLast {
                def side = runTask.name == 'runClient' ? 'CLIENT' : 'SERVER'
                def folder = side.toLowerCase()
                def auditLog = file("build/goggles-audit/${auditMode}/${folder}/logs/latest.log").text
                if (!auditLog.contains("GOGGLES ${side} AUDIT COMPLETE") || auditLog.contains('GOGGLES '+side+' AUDIT FAILED')) {
                    throw new GradleException("Goggles ${side} audit failed; inspect the isolated run log")
                }
            }
        }
    }
}

repositories {
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    if (project.findProperty('withCurios')?.toString()?.toBoolean()) {
        runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${modArchiveName}.jar"

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
